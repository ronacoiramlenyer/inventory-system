name: Deploy to Cloudflare

on:
  push:
    branches: [main, claude/clever-tesla-dagr89]
    paths:
      - "worker/**"
      - "client/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      # Brings the live D1 database up to the shape schema.sql describes,
      # then seeds it if it's empty. Both files are written to be safe to
      # re-run on every deploy, so a brand-new database is provisioned from
      # scratch here and an in-use one keeps its data untouched.
      - name: Apply pending D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DB=lab-management-system-db-v1

          # Column additions have to land BEFORE schema.sql. CREATE TABLE IF
          # NOT EXISTS skips a table that already exists, so it never adds a
          # new column to one -- and schema.sql then tries to index that
          # column and fails. No REFERENCES clause: on a fresh database the
          # table doesn't exist yet and this is expected to fail (hence
          # `|| true`), with schema.sql creating it complete a moment later.
          npx wrangler d1 execute "$DB" --remote --command "ALTER TABLE equipment_logs ADD COLUMN equipment_record_id INTEGER;" || true
          npx wrangler d1 execute "$DB" --remote --command "ALTER TABLE maintenance_schedule_items ADD COLUMN equipment_record_id INTEGER;" || true
          npx wrangler d1 execute "$DB" --remote --command "ALTER TABLE calibration_schedule_items ADD COLUMN equipment_record_id INTEGER;" || true
          npx wrangler d1 execute "$DB" --remote --command "ALTER TABLE work_requests ADD COLUMN equipment_record_id INTEGER;" || true

          # Inventory period closing: the Stock Card gains two non-transaction
          # row kinds (the closing annotation and the new period's Beginning
          # Balance), and F-LAB-010 gains its reference number and closing
          # details. Same reason as above -- an existing table needs these
          # added explicitly before schema.sql indexes them.
          npx wrangler d1 execute "$DB" --remote --command "ALTER TABLE transactions ADD COLUMN entry_type TEXT NOT NULL DEFAULT 'txn';" || true
          npx wrangler d1 execute "$DB" --remote --command "ALTER TABLE transactions ADD COLUMN balance_after INTEGER;" || true
          npx wrangler d1 execute "$DB" --remote --command "ALTER TABLE transactions ADD COLUMN inventory_count_id INTEGER;" || true
          npx wrangler d1 execute "$DB" --remote --command "ALTER TABLE inventory_counts ADD COLUMN reference_no TEXT;" || true
          npx wrangler d1 execute "$DB" --remote --command "ALTER TABLE inventory_counts ADD COLUMN period_label TEXT;" || true
          npx wrangler d1 execute "$DB" --remote --command "ALTER TABLE inventory_counts ADD COLUMN inventory_date TEXT;" || true
          npx wrangler d1 execute "$DB" --remote --command "ALTER TABLE inventory_counts ADD COLUMN cutoff_at TEXT;" || true
          npx wrangler d1 execute "$DB" --remote --command "ALTER TABLE inventory_counts ADD COLUMN closed_at TEXT;" || true
          npx wrangler d1 execute "$DB" --remote --command "ALTER TABLE inventory_counts ADD COLUMN closed_by INTEGER;" || true
          npx wrangler d1 execute "$DB" --remote --command "ALTER TABLE inventory_counts ADD COLUMN closed_by_name TEXT;" || true

          # record_documents is a brand-new table, so schema.sql creates it in
          # full below -- nothing to ALTER here. Listed only so the next
          # person adding a records column knows this is where it goes.

          # Create any table that isn't there yet. schema.sql is entirely
          # CREATE TABLE/INDEX IF NOT EXISTS, so this is safe on every deploy
          # and is what brings a brand-new D1 database up to the current
          # shape. No `|| true` here on purpose: if the schema can't be
          # applied, the deploy must fail loudly rather than ship a Worker
          # pointed at an empty database.
          npx wrangler d1 execute "$DB" --remote --file=./src/db/schema.sql

          # Seed the starter admin/departments/labs. Every statement is
          # INSERT OR IGNORE against a UNIQUE column, so a fresh database
          # gets seeded once and an in-use one is left completely alone.
          npx wrangler d1 execute "$DB" --remote --file=./seed.local.sql

          # One-time data cleanup after collapsing the category list down to
          # Equipment / Tools & Materials / Consumables -- renames items
          # still holding a category value from the old 6-option list to
          # its unambiguous new equivalent. Safe to re-run: each WHERE
          # clause matches nothing once already applied. Items left as
          # Other/NULL ("Uncategorized") aren't touched here since neither
          # maps confidently to one new bucket -- reassign those by hand
          # with the bulk "move to category" tool on the Inventory list.
          npx wrangler d1 execute "$DB" --remote --command "UPDATE items SET category = 'Tools & Materials' WHERE category = 'Materials';" || true
          npx wrangler d1 execute "$DB" --remote --command "UPDATE items SET category = 'Tools & Materials' WHERE category = 'Glassware';" || true
          npx wrangler d1 execute "$DB" --remote --command "UPDATE items SET category = 'Consumables' WHERE category = 'Chemicals';" || true

          # Inventory sheets created before periods existed used 'draft' and
          # 'applied'. A draft becomes the new cycle's open period; an applied
          # one is finished but was never archived, so it is left as 'applied'
          # and shown as a legacy sheet rather than back-filled into the
          # archive with a closing it never actually had.
          npx wrangler d1 execute "$DB" --remote --command "UPDATE inventory_counts SET status = 'open' WHERE status = 'draft';" || true

      # One-time cleanup after renaming the project -- deletes the old
      # inventory-system-api Worker and lsgh-lab-inventory Pages project
      # now that we deploy under their new names below. Safe to remove
      # once this has run successfully.
      - name: Delete old renamed deployments
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler delete inventory-system-api --force || true
          npx wrangler pages project delete lsgh-lab-inventory --yes || true

      - name: Set Worker JWT secret
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "${{ secrets.JWT_SECRET }}" | npx wrangler secret put JWT_SECRET

      - name: Deploy Worker
        id: deploy_worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy | tee deploy.log
          WORKER_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n1)
          if [ -z "$WORKER_URL" ]; then
            echo "Could not find Worker URL in wrangler deploy output" >&2
            exit 1
          fi
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        env:
          VITE_API_URL: ${{ steps.deploy_worker.outputs.worker_url }}/api
        run: npm run build

      - name: Ensure Pages project exists
        working-directory: client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages project create lab-management-system --production-branch=main || true

      - name: Deploy Pages site
        id: deploy_pages
        working-directory: client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist --project-name=lab-management-system --branch=main | tee pages-deploy.log
          PAGES_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' pages-deploy.log | head -n1)
          echo "pages_url=$PAGES_URL" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${{ steps.deploy_worker.outputs.worker_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend: ${{ steps.deploy_pages.outputs.pages_url }}" >> "$GITHUB_STEP_SUMMARY"
