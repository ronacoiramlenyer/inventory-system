name: Deploy to Cloudflare

on:
  push:
    branches: [claude/clever-tesla-dagr89]
    paths:
      - "worker/**"
      - "client/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      # Applies schema changes to the live D1 database that aren't yet
      # there. Each statement is idempotent via `|| true` (ALTER TABLE ADD
      # COLUMN errors if the column already exists), so this is safe to run
      # on every deploy -- append new statements here as schema.sql changes,
      # rather than only applying them by hand.
      - name: Apply pending D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute inventory-system-db --remote --command "ALTER TABLE maintenance_schedule_items ADD COLUMN equipment_item_id INTEGER REFERENCES items(id);" || true
          npx wrangler d1 execute inventory-system-db --remote --command "ALTER TABLE calibration_schedule_items ADD COLUMN equipment_item_id INTEGER REFERENCES items(id);" || true
          npx wrangler d1 execute inventory-system-db --remote --command "ALTER TABLE work_requests ADD COLUMN equipment_item_id INTEGER REFERENCES items(id);" || true

          # One-time data cleanup after collapsing the category list down to
          # Equipment / Tools & Materials / Consumables -- renames items
          # still holding a category value from the old 6-option list to
          # its unambiguous new equivalent. Safe to re-run: each WHERE
          # clause matches nothing once already applied. Items left as
          # Other/NULL ("Uncategorized") aren't touched here since neither
          # maps confidently to one new bucket -- reassign those by hand
          # with the bulk "move to category" tool on the Inventory list.
          npx wrangler d1 execute inventory-system-db --remote --command "UPDATE items SET category = 'Tools & Materials' WHERE category = 'Materials';" || true
          npx wrangler d1 execute inventory-system-db --remote --command "UPDATE items SET category = 'Tools & Materials' WHERE category = 'Glassware';" || true
          npx wrangler d1 execute inventory-system-db --remote --command "UPDATE items SET category = 'Consumables' WHERE category = 'Supplies';" || true
          npx wrangler d1 execute inventory-system-db --remote --command "UPDATE items SET category = 'Consumables' WHERE category = 'Chemicals';" || true

      # One-time cleanup after renaming the project -- deletes the old
      # inventory-system-api Worker and lsgh-lab-inventory Pages project
      # now that we deploy under their new names below. Safe to remove
      # once this has run successfully.
      - name: Delete old renamed deployments
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler delete inventory-system-api --force || true
          npx wrangler pages project delete lsgh-lab-inventory --yes || true

      - name: Set Worker JWT secret
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "${{ secrets.JWT_SECRET }}" | npx wrangler secret put JWT_SECRET

      - name: Deploy Worker
        id: deploy_worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy | tee deploy.log
          WORKER_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n1)
          if [ -z "$WORKER_URL" ]; then
            echo "Could not find Worker URL in wrangler deploy output" >&2
            exit 1
          fi
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        env:
          VITE_API_URL: ${{ steps.deploy_worker.outputs.worker_url }}/api
        run: npm run build

      - name: Ensure Pages project exists
        working-directory: client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages project create lab-management-system --production-branch=main || true

      - name: Deploy Pages site
        id: deploy_pages
        working-directory: client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist --project-name=lab-management-system --branch=main | tee pages-deploy.log
          PAGES_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' pages-deploy.log | head -n1)
          echo "pages_url=$PAGES_URL" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${{ steps.deploy_worker.outputs.worker_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend: ${{ steps.deploy_pages.outputs.pages_url }}" >> "$GITHUB_STEP_SUMMARY"
